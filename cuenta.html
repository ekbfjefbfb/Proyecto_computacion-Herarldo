<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LemusStores - Iniciar sesion">
    <title>LemusStores | Iniciar Sesion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0F'/%3E%3Cpath d='M55 8 L22 56 H46 L40 92 L82 42 H56 Z' fill='%2300CEC9'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/mobile-nav.css">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <header class="header" id="header">
        <div class="header__container">
            <a href="index.html" class="site-logo"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 3L6 20h8l-2 9 12-14h-8l2-12z" fill="currentColor"/></svg><span>LemusStores</span></a>

            <nav class="header__nav"><a href="index.html" class="header__nav-link">Inicio</a><a href="tienda.html" class="header__nav-link">Tienda</a><a href="ofertas.html" class="header__nav-link">Ofertas</a><a href="index.html#contacto" class="header__nav-link">Contacto</a></nav>
            <div class="header__actions"><a href="cuenta.html" class="header__user header__user--active" id="headerUser" title="Mi Cuenta"><i data-lucide="user"></i></a></div>
            <button class="header__menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
        </div>
    </header>

    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-nav__overlay" id="mobileNavOverlay"></div>
        <div class="mobile-nav__sidebar">
            <div class="mobile-nav__header"><a href="index.html" class="site-logo" style="padding:0"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 3L6 20h8l-2 9 12-14h-8l2-12z" fill="currentColor"/></svg><span>LemusStores</span></a><button class="mobile-nav__close" id="mobileNavClose" aria-label="Cerrar"><i data-lucide="x"></i></button></div>
            <ul class="mobile-nav__links">
                <li><a href="index.html" class="mobile-nav__link"><i data-lucide="home"></i> Inicio</a></li>
                <li><a href="tienda.html" class="mobile-nav__link"><i data-lucide="layout-grid"></i> Tienda</a></li>
                <li><a href="ofertas.html" class="mobile-nav__link"><i data-lucide="tag"></i> Ofertas</a></li>
                <li class="mobile-nav__divider"></li>
                <li><a href="cuenta.html" class="mobile-nav__link"><i data-lucide="user"></i> Mi Cuenta</a></li>
                <li><a href="tracking.html" class="mobile-nav__link"><i data-lucide="truck"></i> Tracking</a></li>
            </ul>
        </div>
    </nav>

    <main class="auth-centered" id="main-content">
        <div class="auth-centered__bg"></div>

        <div class="auth-card">
            <div class="auth-card__logo">
                <a href="index.html"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 3L6 20h8l-2 9 12-14h-8l2-12z" fill="currentColor"/></svg><span>LemusStores</span></a>
            </div>

            <div class="auth-card__tabs">
                <button class="auth-card__tab active" data-tab="login">Iniciar sesion</button>
                <button class="auth-card__tab" data-tab="register">Registrarse</button>
            </div>

            <form class="auth-card__form active" id="loginForm" data-form="login">
                <input type="email" class="auth-card__input" placeholder="Correo electronico" required>
                <input type="password" class="auth-card__input" placeholder="Contrasena" required>
                <label class="auth-card__check"><input type="checkbox" checked> Recordarme</label>
                <button type="submit" class="auth-card__submit">Iniciar sesion</button>
                <div class="auth-card__divider"><span>Acceso local demo</span></div>
                <p class="auth-card__footer">No tienes cuenta? <a href="#" onclick="switchTab('register');return false;">Registrate</a></p>
            </form>

            <form class="auth-card__form" id="registerForm" data-form="register">
                <input type="text" class="auth-card__input" placeholder="Nombre completo" required>
                <div class="auth-card__row">
                    <input type="email" class="auth-card__input" placeholder="Correo electronico" required>
                    <input type="tel" class="auth-card__input" placeholder="Telefono">
                </div>
                <input type="password" class="auth-card__input" placeholder="Contraseña (min. 8 caracteres)" required>
                <input type="password" class="auth-card__input" placeholder="Confirmar contrasena" required>
                <label class="auth-card__check"><input type="checkbox" required> Acepto los <a href="terminos-condiciones.html" style="color:var(--color-secondary)">Terminos</a></label>
                <button type="submit" class="auth-card__submit">Crear cuenta</button>
                <p class="auth-card__footer">Ya tienes cuenta? <a href="#" onclick="switchTab('login');return false;">Inicia sesion</a></p>
            </form>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/store.js"></script>
    <script src="https://unpkg.com/lucide@1.27.0/dist/umd/lucide.js"></script>
    <script>
    (function(){
        var existing = null;
        try { existing = JSON.parse(localStorage.getItem('techstore_session')); } catch(e) {}
        if (existing && existing.id) { window.location.href = 'mi-cuenta.html'; return; }

        var mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav'),ov=document.getElementById('mobileNavOverlay'),cl=document.getElementById('mobileNavClose');
        function open(){mn.classList.add('active');mb.classList.add('active');document.body.style.overflow='hidden';}
        function close(){mn.classList.remove('active');mb.classList.remove('active');document.body.style.overflow='';}
        mb.addEventListener('click',function(){mn.classList.contains('active')?close():open();});
        ov.addEventListener('click',close);cl.addEventListener('click',close);

        document.querySelectorAll('.auth-card__tab').forEach(function(tab){
            tab.addEventListener('click',function(){switchTab(tab.dataset.tab);});
        });

        var toast=window.showToast||function(){};

        function safeGetUsers(){try{return JSON.parse(localStorage.getItem('techstore_users')||'[]');}catch(e){return[];}}
        function safeSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}

        document.getElementById('loginForm').addEventListener('submit',function(e){
            e.preventDefault();
            var inputs=this.querySelectorAll('.auth-card__input');
            var email=inputs[0].value.trim();
            var pass=inputs[1].value;
            if(!email||!pass){toast('error','Error','Completa todos los campos');return;}
            var users=safeGetUsers();
            var user=users.find(function(u){return u.email===email&&u.password===pass;});
            if(!user){toast('error','Error','Correo o contrasena incorrectos');return;}
            var sessionData={id:user.id,name:user.name,email:user.email,phone:user.phone};
            if(!safeSet('techstore_session',sessionData)){toast('error','Error','No se pudo guardar la sesion');return;}
            toast('success','Bienvenido','Hola '+user.name);
            window.location.href='mi-cuenta.html';
        });

        document.getElementById('registerForm').addEventListener('submit',function(e){
            e.preventDefault();
            var inputs=this.querySelectorAll('.auth-card__input');
            var name=inputs[0].value.trim();
            var email=inputs[1].value.trim();
            var phone=inputs[2]?inputs[2].value.trim():'';
            var pass=inputs[3].value;
            var confirm=inputs[4].value;
            var terms=this.querySelector('input[type=checkbox]').checked;
            if(!name||!email||!pass){toast('error','Error','Completa nombre, correo y contrasena');return;}
            if(pass.length<8){toast('error','Error','La contrasena debe tener minimo 8 caracteres');return;}
            if(pass!==confirm){toast('error','Error','Las contrasenas no coinciden');return;}
            if(!terms){toast('error','Error','Debes aceptar los terminos');return;}
            var users=safeGetUsers();
            if(users.find(function(u){return u.email===email;})){toast('error','Error','Este correo ya esta registrado');return;}
            var newUser={id:Date.now(),name:name,email:email,phone:phone,password:pass};
            users.push(newUser);
            if(!safeSet('techstore_users',users)){toast('error','Error','No se pudo crear la cuenta');return;}
            var sessionData={id:newUser.id,name:newUser.name,email:newUser.email,phone:newUser.phone};
            if(!safeSet('techstore_session',sessionData)){toast('error','Error','Cuenta creada pero no se pudo iniciar sesion');window.location.href='cuenta.html';return;}
            window.location.href='mi-cuenta.html';
        });
    })();

    function switchTab(tab){
        document.querySelectorAll('.auth-card__tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});
        document.querySelectorAll('.auth-card__form').forEach(function(f){f.classList.toggle('active',f.dataset.form===tab);});
    }
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
